services:
  - type: web
    name: penstrokes-ai
    runtime: python
    buildCommand: cd frontend && npm install && npx vite build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
